name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force push should replace the run in flight rather than queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Ubuntu is the cheap default and still the only place the whole check has to pass: no test here
    # touches `process.platform`, the Keychain or `mdfind`, and `scripts/dev-app-name.mjs` is a no-op
    # off macOS. Windows is here because the release now builds there too, and `scripts/licenses.mjs`
    # shells out to pnpm, which is a `.cmd` on Windows: a break in it takes `pnpm build` down with it,
    # and this is where that is caught on a pull request rather than at tag time. macOS stays absent;
    # anything that starts depending on it moves this to `macos-15`.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
