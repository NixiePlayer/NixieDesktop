name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force push should replace the run in flight rather than queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Ubuntu rather than the macos-15 the release runs on: no test here touches
    # `process.platform`, the Keychain or `mdfind`, and `scripts/dev-app-name.mjs` is a
    # no-op off macOS, so `pnpm check` passes on Linux at a fraction of the runner cost.
    # Anything that starts depending on macOS moves this to `macos-15`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
