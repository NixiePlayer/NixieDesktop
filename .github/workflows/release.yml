name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag and package version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e 'const version = require("./package.json").version; if (version !== process.argv[1]) throw new Error(`package ${version} does not match tag ${process.argv[1]}`)' "$VERSION"
      - run: pnpm audit --audit-level low
      - run: pnpm check
      - run: pnpm release:gate
        env:
          NIXIE_RELEASE_GATES_ACCEPTED: ${{ secrets.NIXIE_RELEASE_GATES_ACCEPTED }}

  macos:
    needs: prepare
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec electron-builder --mac --x64 --arm64 -c.mac.notarize=true --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          if-no-files-found: error
          retention-days: 3
          path: |
            release/latest-mac.yml
            release/*.dmg
            release/*.zip
            release/*.blockmap

  windows:
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Windows signing stays deferred until a certificate is available.
      - run: pnpm exec electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          if-no-files-found: error
          retention-days: 3
          path: |
            release/latest.yml
            release/*.exe
            release/*.blockmap

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec electron-builder --linux --x64 --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          if-no-files-found: error
          retention-days: 3
          path: |
            release/latest-linux.yml
            release/*.AppImage

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: release
          merge-multiple: true
      - name: Verify the complete release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > expected-assets.txt <<ASSETS
          Nixie-${VERSION}-applesilicon.dmg
          Nixie-${VERSION}-arm64-mac.zip
          Nixie-${VERSION}-arm64-mac.zip.blockmap
          Nixie-${VERSION}-intel.dmg
          Nixie-${VERSION}-mac.zip
          Nixie-${VERSION}-mac.zip.blockmap
          Nixie-${VERSION}-setup.exe
          Nixie-${VERSION}-setup.exe.blockmap
          Nixie-${VERSION}-x64.AppImage
          latest-linux.yml
          latest-mac.yml
          latest.yml
          ASSETS
          find release -maxdepth 1 -type f -exec basename {} \; | sort > actual-assets.txt
          sort -o expected-assets.txt expected-assets.txt
          diff -u expected-assets.txt actual-assets.txt
      - run: pnpm dlx git-cliff@2.13.1 --latest --strip all --output NOTES.md
      - name: Publish the immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true || {
              echo "Refusing to change an existing published release" >&2
              exit 1
            }
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes ""
          fi
          gh release upload --clobber "$GITHUB_REF_NAME" release/*
          gh release edit "$GITHUB_REF_NAME" --notes-file NOTES.md --draft=false --latest
